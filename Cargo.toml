[package]
name = "winterminal-plus-plus"
version = "0.2.0"
description = "A tmux-style input controller for native Windows Terminal panes"
edition = "2024"
rust-version = "1.85"
default-run = "wter"

[lib]
name = "winterminal"

[[bin]]
name = "winterminal"
path = "src/bin/winterminal.rs"

[[bin]]
name = "wter"
path = "src/bin/wter.rs"

[[bin]]
name = "winterminald"
path = "src/bin/winterminald.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
